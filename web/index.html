<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nine Reigns</title>
  <meta name="description" content="You're a cat on a two-week trial. Swipe your way into a forever home… or back to the shelter.">
  <meta name="theme-color" content="#221302">
  <meta property="og:title" content="Nine Reigns">
  <meta property="og:description" content="You're a cat on a two-week trial. Swipe your way into a forever home… or back to the shelter.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vorpus.github.io/nine-reigns/">
  <meta property="og:site_name" content="Nine Reigns">
  <meta property="og:image" content="https://vorpus.github.io/nine-reigns/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nine Reigns: a cartoon cat beside a swipe card and four meters for Joy, Home, Instinct and Belly.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nine Reigns">
  <meta name="twitter:description" content="You're a cat on a two-week trial. Swipe your way into a forever home… or back to the shelter.">
  <meta name="twitter:image" content="https://vorpus.github.io/nine-reigns/og.png">
  <meta name="twitter:image:alt" content="Nine Reigns: a cartoon cat beside a swipe card and four meters.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/SpaceMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Title: one tap starts. No menu. -->
    <section id="screen-title" class="screen screen-title" hidden>
      <button class="title-tap" id="btn-start" aria-label="Start">
        <span class="title-band" id="title-band" aria-hidden="true"></span>
        <span class="logo" aria-hidden="true">Nine<br>Reigns</span>
        <span class="visually-hidden">Nine Reigns. Tap to start.</span>
        <span class="title-status" id="title-status" aria-hidden="true"></span>
        <span class="title-play" id="title-play" aria-hidden="true"></span>
      </button>
      <p class="title-foot" id="title-foot"></p>
    </section>

    <!-- Trial file (Reigns' timeline): cat, day, goals, NEXT. Also the succession screen. -->
    <section id="screen-file" class="screen screen-file" hidden>
      <nav class="hud-icons" aria-label="Menu"></nav>
      <div class="file-main">
        <div class="file-day" id="file-day"></div>
        <div class="track" id="track" aria-hidden="true">
          <span class="track-line"></span>
          <span class="track-end track-shelter"></span>
          <span class="track-end track-home"></span>
          <span class="track-ticks" id="track-ticks"></span>
          <span class="track-marker" id="track-marker"><span class="track-stem"></span><span class="track-cat" id="track-cat"></span></span>
        </div>
        <div class="file-who">
          <div class="file-name" id="file-name"></div>
          <div class="file-sub" id="file-sub"></div>
          <div class="file-life" id="file-life"></div>
        </div>
        <div class="file-meta" id="file-meta"></div>
        <div class="file-flash" id="file-flash" aria-live="polite"></div>
      </div>
      <div class="file-band">
        <ul class="file-goals" id="file-goals" aria-label="Goals"></ul>
        <button class="next-btn" id="btn-file-next"><span class="next-dot" aria-hidden="true"></span>Next</button>
      </div>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen screen-game" hidden>
      <header class="bar bar-top">
        <div class="meters" id="meters"></div>
      </header>
      <div class="prompt-wrap"><p class="prompt" id="prompt" aria-live="polite"></p></div>
      <div class="stage" id="stage">
        <div class="card-slot" id="card-slot">
          <div class="deck-back b2"></div>
          <div class="deck-back b1"></div>
          <div class="card-hold">
            <div class="card" id="card" tabindex="0" aria-describedby="prompt">
              <div class="choice choice-left" id="choice-left"></div>
              <div class="choice choice-right" id="choice-right"></div>
              <div class="portrait" id="portrait"></div>
              <div class="card-cover" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="char-name" id="char-name"></div>
        <div class="banner" id="banner" hidden aria-live="polite"></div>
      </div>
      <button class="arrow arrow-left" id="btn-left" aria-label="Swipe left"></button>
      <button class="arrow arrow-right" id="btn-right" aria-label="Swipe right"></button>
      <footer class="bar bar-bottom">
        <div class="foot-left">
          <div class="foot-name" id="cat-name"></div>
          <div class="foot-days" id="foot-days"></div>
        </div>
        <button class="foot-right" id="btn-menu" aria-label="Goals and menu">
          <span class="foot-day" id="foot-day"></span>
          <span class="goal-slots" id="goals"></span>
        </button>
      </footer>
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </section>

    <!-- The / Trial / is over (and the adoption equivalent) -->
    <section id="screen-over" class="screen screen-over" hidden>
      <nav class="hud-icons" aria-label="Menu"></nav>
      <h2 class="stack" id="over-stack"></h2>
      <div class="over-band">
        <div class="over-tag" id="over-tag" aria-hidden="true"></div>
        <div class="over-name" id="over-name"></div>
        <div class="over-days" id="over-days"></div>
        <div class="over-title" id="over-title"></div>
        <button class="next-btn" id="btn-over-next"><span class="next-dot" aria-hidden="true"></span>Next</button>
      </div>
      <div class="stars" id="over-stars" aria-hidden="true"></div>
    </section>

    <!-- Memento Meowri -->
    <section id="screen-gallery" class="screen screen-list" hidden>
      <header class="list-head"><button class="back" data-back aria-label="Back"></button><h2>Memento Meowri</h2></header>
      <div class="list-body">
        <p class="list-sub" id="gallery-sub"></p>
        <div class="gallery" id="gallery"></div>
        <h3>Deeds</h3>
        <ul class="ach-list" id="ach-list"></ul>
      </div>
    </section>

    <!-- Cosmetics -->
    <section id="screen-cosmetics" class="screen screen-list" hidden>
      <header class="list-head"><button class="back" data-back aria-label="Back"></button><h2>Under the Bed</h2></header>
      <div class="list-body">
        <p class="list-sub">Everything you've stashed down here. Hair ties not included.</p>
        <div class="cos-preview" id="cos-preview"></div>
        <div id="cos-groups"></div>
      </div>
    </section>

    <!-- Pause menu (tap the footer) -->
    <div class="modal" id="modal-menu" hidden>
      <div class="modal-box" role="dialog" aria-labelledby="menu-title">
        <h2 id="menu-title">Goals</h2>
        <ul class="menu-goals" id="menu-goals"></ul>
        <button class="btn" id="btn-resume">Resume</button>
        <button class="btn" id="btn-abandon">Give up this cat</button>
        <button class="btn btn-small" id="btn-quit">Title screen</button>
      </div>
    </div>

    <!-- Settings (gear) -->
    <div class="modal" id="modal-settings" hidden>
      <div class="modal-box" role="dialog" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
        <button class="btn" id="btn-sound" aria-pressed="false">Sound: off</button>
        <div class="difficulty" id="difficulty" hidden role="radiogroup" aria-label="Difficulty">
          <button class="seg" data-diff="easy" role="radio">Easy</button>
          <button class="seg" data-diff="normal" role="radio">Normal</button>
          <button class="seg" data-diff="hard" role="radio">Hard</button>
        </div>
        <button class="btn btn-chaos" id="btn-chaos" hidden>Chaos Mode</button>
        <button class="btn btn-small" id="btn-settings-close">Close</button>
      </div>
    </div>

    <div class="loading" id="loading">Loading…</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
