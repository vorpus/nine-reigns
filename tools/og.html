<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../web/css/tokens.css">
<link rel="stylesheet" href="../web/css/style.css">
<style>
  html, body { overflow: hidden; }
  body { margin: 0; background: var(--c-bg); }
  .og { width: 1200px; height: 630px; display: flex; align-items: center; gap: 40px; padding: 0 70px; box-sizing: border-box; background: var(--c-bg); }
  .og-left { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .og-left .logo { font-size: 92px; margin: 0; }
  .og-cat { width: 220px; height: 220px; }
  .og-cat svg { width: 100%; height: 100%; }
  .og-tag { font-family: var(--font-prompt); font-style: italic; color: var(--c-bar-dim); font-size: 21px; letter-spacing: .02em; text-align: center; margin: 4px 0 0; max-width: 540px; }
  .phone { width: 400px; height: 560px; border-radius: 28px; overflow: hidden; background: var(--c-stage); display: flex; flex-direction: column; box-shadow: 0 0 0 10px #1c1819; }
  .phone .bar-top { height: 96px; padding: 0 16px; }
  .phone .meter-full { clip-path: inset(var(--clip) 0 0 0); transition: none; }
  .phone .prompt-wrap { height: auto; padding: 18px 26px 6px; }
  .phone .prompt { font-size: 17px; }
  .phone .stage { flex: 1; }
  .phone .card { transform: translate(-30px, 6px) rotate(-8deg); --lp: 1; }
  .icon { width: 180px; height: 180px; background: var(--c-bg); display: grid; place-items: center; }
  .icon svg { width: 160px; height: 160px; }
  .phone .portrait svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { catSVG } from '../web/js/catsvg.js';
  import { portrait, meterSVG } from '../web/js/portraits.js';
  import { meterClip } from '../web/js/ui.js';
  const look = { coat: { fur: '#e8964a', shade: '#c9732c', belly: '#f8dfc0' }, pattern: 'tabby', accessory: 'bell_collar' };
  const root = document.getElementById('root');
  if (location.hash === '#icon') {
    root.innerHTML = `<div class="icon">${catSVG({ ...look, accessory: 'none' }, { noTail: true }).replace('viewBox="0 0 200 200"', 'viewBox="36 6 128 128"')}</div>`;
  } else {
    const meter = (m, v) => `<div class="meter"><div class="meter-dot ${v === 70 ? 'big' : v === 40 ? 'small' : ''}"></div><div class="meter-icon" style="--clip:${meterClip(m, v)}%">${meterSVG(m, 'meter-empty')}${meterSVG(m, 'meter-full')}</div></div>`;
    root.innerHTML = `<div class="og">
      <div class="og-left"><h1 class="logo">Nine<br>Reigns</h1><div class="og-cat">${catSVG(look)}</div>
        <p class="og-tag">You're a cat on a two-week trial. Swipe your way into a forever home… or back to the shelter.</p></div>
      <div class="phone">
        <header class="bar bar-top"><div class="meters">${meter('joy', 55)}${meter('home', 70)}${meter('instinct', 40)}${meter('belly', 30)}</div></header>
        <div class="prompt-wrap"><p class="prompt">A full glass of water sits at the very edge of the table. Albert is on a work call.</p></div>
        <div class="stage"><div class="card-slot"><div class="deck-back b2"></div><div class="deck-back b1"></div><div class="card-hold"><div class="card leaning" style="--card-color:#1f9e9e"><div class="choice choice-left">Knock it off</div><div class="portrait">${portrait('albert', { expression: 'drag' })}</div></div></div></div><div class="char-name">Albert</div></div>
      </div>
    </div>`;
  }
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
